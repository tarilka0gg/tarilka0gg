name: Update stats
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild assets/stats.svg
        run: python3 scripts/update_stats.py "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if it changed
        run: |
          git config user.name "tarilka0gg"
          git config user.email "216761460+tarilka0gg@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || git commit -m "Update stats" && git push
